<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Tegn-teller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultat {
            margin-top: 15px;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Tegn-teller</h1>
    <div class="container">
        <label for="ordInput">Skriv inn et ord:</label>
        <input type="text" id="ordInput" placeholder="Skriv et ord her">
        <button onclick="tellTegn()">Tell tegn</button>
        <div id="resultat"></div>
    </div>

    <script>
        function tellTegn() {
            // Hent ordet brukeren har skrevet
            var ord = document.getElementById("ordInput").value;

            // Finn antall tegn
            var antallTegn = ord.length;

            // Lag meldingen
            var melding = "Ordet " + ord + " består av " + antallTegn + " tegn";

            // Skriv ut meldingen på siden
            document.getElementById("resultat").textContent = melding;
        }
    </script>
</body>
</html>
