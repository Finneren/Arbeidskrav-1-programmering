<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordteller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            text-align: center;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-left: 10px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Ordteller</h1>

    <input type="text" id="ordInput" placeholder="Skriv inn et ord">
    <button onclick="tellTegn()">Tell tegn</button>

    <div id="resultat"></div>

    <script>
        function tellTegn() {
            const ord = document.getElementById('ordInput').value;
            const antallTegn = ord.length;

            document.getElementById('resultat').textContent =
                `Ordet ${ord} består av ${antallTegn} tegn`;
        }
    </script>
</body>
</html>
